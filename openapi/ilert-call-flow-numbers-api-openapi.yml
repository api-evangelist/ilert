openapi: 3.2.0
info:
  title: ilert REST Call Flow Numbers API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Call Flow Numbers
paths:
  /call-flow-numbers:
    get:
      tags:
      - Call Flow Numbers
      summary: List call flow numbers
      parameters:
      - name: state
        in: query
        description: Filter call flow numbers by availability state.
        schema:
          type: string
          default: ANY
          enum:
          - ANY
          - AVAILABLE
          - USED
      - name: include
        in: query
        description: Describes optional properties that should be included in the response. You may declare multiple. (assignedTo)
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - assignedTo
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: the maximum number of results when paging through a list of entities.
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      - name: query
        in: query
        description: Filter call flow numbers by name.
        schema:
          type: string
      responses:
        '200':
          description: The call flow numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallFlowNumberDetails'
      operationId: getCallFlowNumbers
      x-operation-id-source: derived
  /call-flow-numbers/{id}:
    get:
      tags:
      - Call Flow Numbers
      summary: Get a specific call flow number
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The requested call flow number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallFlowNumberDetails'
      operationId: getCallFlowNumbersById
      x-operation-id-source: derived
components:
  schemas:
    CallFlowNumberAssignedTo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CallFlowNumberState:
      type: string
      enum:
      - AVAILABLE
      - USED
    PhoneNumber:
      type: object
      properties:
        regionCode:
          type: string
        number:
          type: string
    CallFlowNumberDetails:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        state:
          $ref: '#/components/schemas/CallFlowNumberState'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        assignedTo:
          $ref: '#/components/schemas/CallFlowNumberAssignedTo'
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
