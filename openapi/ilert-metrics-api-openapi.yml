openapi: 3.2.0
info:
  title: ilert REST Metrics API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Metrics
paths:
  /metrics:
    get:
      tags:
      - Metrics
      summary: Get metrics
      parameters:
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: 'the maximum number of results when paging through a list of metrics. (Note: when using ?include maximum is reduced to 25)'
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 10
      - name: include
        in: query
        description: Describes optional properties that should be included in the response. You may declare multiple. (dataSource, integrationKey)
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - dataSource
            - integrationKey
      responses:
        '200':
          description: The metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricList'
      operationId: getMetrics
      x-operation-id-source: derived
    post:
      tags:
      - Metrics
      summary: Create a new metric
      requestBody:
        description: The metric
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricPost'
        required: true
      responses:
        '200':
          description: The newly created metric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
      x-codegen-request-body-name: metric
      operationId: postMetrics
      x-operation-id-source: derived
  /metrics/{id}:
    get:
      tags:
      - Metrics
      summary: Get a specific Metric
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The requested metric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
      operationId: getMetricsById
      x-operation-id-source: derived
    put:
      tags:
      - Metrics
      summary: Update the specific Metric
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: The metric
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricPost'
        required: true
      responses:
        '200':
          description: The updated metric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
      x-codegen-request-body-name: metric
      operationId: putMetricsById
      x-operation-id-source: derived
    delete:
      tags:
      - Metrics
      summary: Delete the specific Metric
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteMetricsById
      x-operation-id-source: derived
components:
  schemas:
    MetricMetadata:
      type: object
      description: Only required if the metric has a dataSource. You may not change this after creation.
      default: 'null'
      oneOf:
      - $ref: '#/components/schemas/MDataDogMetadata'
      - $ref: '#/components/schemas/MPrometheusMetadata'
    MetricDataSource:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        type:
          $ref: '#/components/schemas/MetricDataSourceType'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        metadata:
          $ref: '#/components/schemas/MetricDataSourceMetadata'
    MParamsDatadog:
      required:
      - apiKey
      - applicationKey
      - region
      type: object
      properties:
        region:
          type: string
        apiKey:
          type: string
        applicationKey:
          type: string
    MDataDogMetadata:
      required:
      - query
      type: object
      properties:
        query:
          type: string
    MPrometheusMetadata:
      required:
      - query
      type: object
      properties:
        query:
          type: string
    MetricPost:
      required:
      - aggregationType
      - displayType
      - name
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        aggregationType:
          $ref: '#/components/schemas/MetricAggregationType'
        displayType:
          $ref: '#/components/schemas/MetricDisplayType'
        interpolateGaps:
          type: boolean
          default: false
        lockYAxisMax:
          type: number
          format: double
        lockYAxisMin:
          type: number
          format: double
        mouseOverDecimal:
          maximum: 6
          minimum: 0
          type: number
          format: int32
        showValuesOnMouseOver:
          type: boolean
          default: false
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        unitLabel:
          type: string
        metadata:
          $ref: '#/components/schemas/MetricMetadata'
        dataSource:
          type: object
          properties:
            id:
              type: number
              description: dataSource is required when providing metadata
    MetricDataSourceNoIncludes:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        type:
          $ref: '#/components/schemas/MetricDataSourceType'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
    Metric:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        aggregationType:
          $ref: '#/components/schemas/MetricAggregationType'
        displayType:
          $ref: '#/components/schemas/MetricDisplayType'
        interpolateGaps:
          type: boolean
          default: false
        lockYAxisMax:
          type: number
          format: double
        lockYAxisMin:
          type: number
          format: double
        mouseOverDecimal:
          maximum: 6
          minimum: 0
          type: number
          format: int32
        showValuesOnMouseOver:
          type: boolean
          default: false
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        unitLabel:
          type: string
        integrationKey:
          type: string
        metadata:
          $ref: '#/components/schemas/MetricMetadata'
        dataSource:
          $ref: '#/components/schemas/MetricDataSource'
    MetricDisplayType:
      type: string
      enum:
      - GRAPH
      - SINGLE
    MParamsPrometheus:
      required:
      - authType
      - url
      type: object
      properties:
        url:
          type: string
        authType:
          type: string
          enum:
          - NONE
          - BASIC
          - HEADER
        basicUser:
          type: string
          description: Optional, required for 'BASIC'
        basicPass:
          type: string
          description: Optional, required for 'BASIC'
        headerKey:
          type: string
          description: Optional, required for 'HEADER'
        headerValue:
          type: string
          description: Optional, required for 'HEADER'
    MetricList:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        aggregationType:
          $ref: '#/components/schemas/MetricAggregationType'
        displayType:
          $ref: '#/components/schemas/MetricDisplayType'
        interpolateGaps:
          type: boolean
          default: false
        lockYAxisMax:
          type: number
          format: double
        lockYAxisMin:
          type: number
          format: double
        mouseOverDecimal:
          maximum: 6
          minimum: 0
          type: number
          format: int32
        showValuesOnMouseOver:
          type: boolean
          default: false
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        unitLabel:
          type: string
        integrationKey:
          type: string
        dataSource:
          $ref: '#/components/schemas/MetricDataSourceNoIncludes'
    MetricDataSourceMetadata:
      type: object
      oneOf:
      - $ref: '#/components/schemas/MParamsDatadog'
      - $ref: '#/components/schemas/MParamsPrometheus'
    TeamRel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    MetricAggregationType:
      type: string
      enum:
      - AVG
      - SUM
      - MIN
      - MAX
      - LAST
    MetricDataSourceType:
      type: string
      enum:
      - DATADOG
      - PROMETHEUS
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
