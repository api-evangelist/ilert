openapi: 3.2.0
info:
  title: ilert REST Incident Templates API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Incident Templates
paths:
  /incident-templates:
    get:
      tags:
      - Incident Templates
      summary: Get incident templates
      parameters:
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: the maximum number of results when paging through a list of entities.
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: The incident templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentTemplate'
      operationId: getIncidentTemplates
      x-operation-id-source: derived
    post:
      tags:
      - Incident Templates
      summary: Create a new incident template
      requestBody:
        description: the incident template
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentTemplate'
        required: true
      responses:
        '200':
          description: The newly created incident template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTemplate'
      x-codegen-request-body-name: incident-template
      operationId: postIncidentTemplates
      x-operation-id-source: derived
  /incident-templates/{id}:
    get:
      tags:
      - Incident Templates
      summary: Get a specific incident template
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The requested incident template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTemplate'
      operationId: getIncidentTemplatesById
      x-operation-id-source: derived
    put:
      tags:
      - Incident Templates
      summary: Update the specific incident template
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: the incident template
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentTemplate'
        required: true
      responses:
        '200':
          description: The updated incident template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTemplate'
      x-codegen-request-body-name: incident-template
      operationId: putIncidentTemplatesById
      x-operation-id-source: derived
    delete:
      tags:
      - Incident Templates
      summary: Remove a specific incident template
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteIncidentTemplatesById
      x-operation-id-source: derived
components:
  schemas:
    IncidentStatus:
      type: string
      description: the incident status
      enum:
      - INVESTIGATING
      - IDENTIFIED
      - MONITORING
      - RESOLVED
    IncidentTemplate:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        summary:
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatus'
        message:
          type: string
        sendNotification:
          type: boolean
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
    TeamRel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
