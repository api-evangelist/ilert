openapi: 3.2.0
info:
  title: ilert REST Series API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Series
paths:
  /series/{key}:
    post:
      tags:
      - Series
      summary: Ingest a series for a metric
      description: Post a time point or multiple time points (series) to a metric. User authorization is not required instead provide the integration key of your metric.
      parameters:
      - name: key
        in: path
        description: integration key of resource
        required: true
        schema:
          type: string
      requestBody:
        description: the time point or series of time points
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesOption'
        required: true
      responses:
        '202':
          description: The time points have been accepted
          content: {}
      security: []
      x-codegen-request-body-name: series
      operationId: postSeriesByKey
      x-operation-id-source: derived
components:
  schemas:
    MultipleTimePoint:
      type: object
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/SingleTimePoint'
    SeriesOption:
      type: object
      description: Can either be a single time point, omitting timestamp field is allowed as it will be replaced with now() - or a series of multiple time points
      oneOf:
      - $ref: '#/components/schemas/SingleTimePoint'
      - $ref: '#/components/schemas/MultipleTimePoint'
    SingleTimePoint:
      required:
      - value
      type: object
      properties:
        timestamp:
          type: number
          description: The unix epoch second of your time point
          format: int64
        value:
          type: number
          description: Value of your time point
          format: double
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
