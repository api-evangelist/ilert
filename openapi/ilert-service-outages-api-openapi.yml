openapi: 3.2.0
info:
  title: ilert REST Service Outages API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Service Outages
paths:
  /service-outages:
    get:
      tags:
      - Service Outages
      summary: Get the outages (including applied overrides) of a specific service
      parameters:
      - name: service
        in: query
        description: the id of the service for which the outages should be fetched
        schema:
          type: number
      - name: from
        in: query
        description: from date, ISO-UTC e.g. 2021-05-25T21:24:56.771Z
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: until date, ISO-UTC e.g. 2021-05-26T21:24:56.771Z
        schema:
          type: string
          format: date-time
      - name: ignore-overrides
        in: query
        description: if the outages should not take overrides into account, default is false
        schema:
          type: boolean
      responses:
        '200':
          description: The outages of the service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOutage'
      operationId: getServiceOutages
      x-operation-id-source: derived
  /service-outages/overrides:
    get:
      tags:
      - Service Outages
      summary: Get the overrides of a specific service
      parameters:
      - name: service
        in: query
        description: the id of the service for which the overrides should be fetched
        schema:
          type: number
      - name: from
        in: query
        description: from date, ISO-UTC e.g. 2021-05-25T21:24:56.771Z
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: until date, ISO-UTC e.g. 2021-05-26T21:24:56.771Z
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: The overrides of the service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOutageOverride'
      operationId: getServiceOutagesOverrides
      x-operation-id-source: derived
    post:
      tags:
      - Service Outages
      summary: Override a part of a service's outage history
      requestBody:
        description: override that should be made
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOutageOverride'
        required: true
      responses:
        '201':
          description: The added override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOutageOverride'
      x-codegen-request-body-name: override
      operationId: postServiceOutagesOverrides
      x-operation-id-source: derived
  /service-outages/overrides/{id}:
    get:
      tags:
      - Service Outages
      summary: Get the specific service outage override
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOutageOverride'
      operationId: getServiceOutagesOverridesById
      x-operation-id-source: derived
    put:
      tags:
      - Service Outages
      summary: Update an existing service outage override
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: override that should be made
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOutageOverride'
        required: true
      responses:
        '200':
          description: The updated override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOutageOverride'
      x-codegen-request-body-name: override
      operationId: putServiceOutagesOverridesById
      x-operation-id-source: derived
    delete:
      tags:
      - Service Outages
      summary: Remove a service outage override
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: the response
          content: {}
      operationId: deleteServiceOutagesOverridesById
      x-operation-id-source: derived
components:
  schemas:
    ServiceOutageOverride:
      type: object
      properties:
        id:
          type: string
        service:
          $ref: '#/components/schemas/ServiceNoIncludes'
        status:
          $ref: '#/components/schemas/ServiceStatus'
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
    ServiceNoIncludes:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        alias:
          type: string
        status:
          $ref: '#/components/schemas/ServiceStatus'
        description:
          type: string
        oneOpenIncidentOnly:
          type: boolean
        showUptimeHistory:
          type: boolean
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
    ServiceStatus:
      type: string
      description: the service status
      enum:
      - OPERATIONAL
      - UNDER_MAINTENANCE
      - DEGRADED
      - PARTIAL_OUTAGE
      - MAJOR_OUTAGE
    TeamRel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ServiceOutage:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ServiceStatus'
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
