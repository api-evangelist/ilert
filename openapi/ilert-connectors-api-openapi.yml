openapi: 3.2.0
info:
  title: ilert REST Connectors API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Connectors
paths:
  /connectors:
    get:
      tags:
      - Connectors
      summary: Get connectors
      parameters:
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: the maximum number of results when paging through a list of entities.
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: The connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connector'
      operationId: getConnectors
      x-operation-id-source: derived
    post:
      tags:
      - Connectors
      summary: Create a new connector
      requestBody:
        description: the connector
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector'
        required: true
      responses:
        '200':
          description: The newly created connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
      x-codegen-request-body-name: connector
      operationId: postConnectors
      x-operation-id-source: derived
  /connectors/{id}:
    get:
      tags:
      - Connectors
      summary: Get a specific connector
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The requested connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
      operationId: getConnectorsById
      x-operation-id-source: derived
    put:
      tags:
      - Connectors
      summary: 'Update the specific connector. (note: type cannot be changed)'
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: string
      requestBody:
        description: the connector
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connector'
        required: true
      responses:
        '200':
          description: The updated connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
      x-codegen-request-body-name: connector
      operationId: putConnectorsById
      x-operation-id-source: derived
    delete:
      tags:
      - Connectors
      summary: Remove a specific connector
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteConnectorsById
      x-operation-id-source: derived
components:
  schemas:
    EParamsSysdig:
      type: object
      properties:
        apiKey:
          type: string
    EParamsDatadog:
      type: object
      properties:
        apiKey:
          type: string
    ConnectorType:
      type: string
      enum:
      - jira
      - microsoft_teams_bot
      - servicenow
      - slack
      - zendesk
      - discord
      - github
      - topdesk
      - zammad
      - mattermost
      - zoom_chat
      - dingtalk
      - dynamic
      - zabbix
      - autotask
      - google_chat_bot
    EParamsTopdesk:
      type: object
      properties:
        url:
          type: string
        username:
          type: string
        password:
          type: string
    EParamsZendesk:
      type: object
      properties:
        url:
          type: string
        email:
          type: string
        apiKey:
          type: string
    EParamsServiceNow:
      type: object
      properties:
        url:
          type: string
        username:
          type: string
        password:
          type: string
    EParamsStatusPageIO:
      type: object
      properties:
        apiKey:
          type: string
    EParamsDingTalk:
      type: object
      properties:
        url:
          type: string
        secret:
          type: string
    EParamsZabbix:
      type: object
      properties:
        url:
          type: string
        apiKey:
          type: string
    EParamsGithub:
      type: object
      properties:
        apiKey:
          type: string
    EParamsDiscord:
      type: object
      properties:
        url:
          type: string
    EParamsMicrosoftTeams:
      type: object
      properties:
        url:
          type: string
    EParamsAWSLambda:
      type: object
      properties:
        authorization:
          type: string
    EParamsGoogleFunction:
      type: object
      properties:
        authorization:
          type: string
    EParamsJira:
      type: object
      properties:
        url:
          type: string
        email:
          type: string
        password:
          type: string
    EParamsSlack:
      type: object
    EParamsAzureFunction:
      type: object
      properties:
        authorization:
          type: string
    Connector:
      required:
      - name
      - type
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ConnectorType'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        params:
          type: object
          oneOf:
          - $ref: '#/components/schemas/EParamsDatadog'
          - $ref: '#/components/schemas/EParamsJira'
          - $ref: '#/components/schemas/EParamsMicrosoftTeams'
          - $ref: '#/components/schemas/EParamsServiceNow'
          - $ref: '#/components/schemas/EParamsSlack'
          - $ref: '#/components/schemas/EParamsZendesk'
          - $ref: '#/components/schemas/EParamsDiscord'
          - $ref: '#/components/schemas/EParamsGithub'
          - $ref: '#/components/schemas/EParamsTopdesk'
          - $ref: '#/components/schemas/EParamsAWSLambda'
          - $ref: '#/components/schemas/EParamsAzureFunction'
          - $ref: '#/components/schemas/EParamsGoogleFunction'
          - $ref: '#/components/schemas/EParamsSysdig'
          - $ref: '#/components/schemas/EParamsStatusPageIO'
          - $ref: '#/components/schemas/EParamsDingTalk'
          - $ref: '#/components/schemas/EParamsZabbix'
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
