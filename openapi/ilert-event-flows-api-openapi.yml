openapi: 3.2.0
info:
  title: ilert REST Event Flows API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Event Flows
paths:
  /event-flows:
    get:
      tags:
      - Event Flows
      summary: List existing event flows
      description: Returns a shallow list of event flows without the full node tree. Use the single resource endpoint to retrieve the complete event flow including all nodes and branches.
      parameters:
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: the maximum number of results when paging through a list of entities.
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: The event flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventFlowListItem'
      operationId: getEventFlows
      x-operation-id-source: derived
    post:
      tags:
      - Event Flows
      summary: Create a new event flow
      requestBody:
        description: the event flow
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFlow'
        required: true
      responses:
        '201':
          description: The newly created event flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFlow'
      x-codegen-request-body-name: eventFlow
      operationId: postEventFlows
      x-operation-id-source: derived
  /event-flows/{id}:
    get:
      tags:
      - Event Flows
      summary: Get a specific event flow
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The requested event flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFlow'
      operationId: getEventFlowsById
      x-operation-id-source: derived
    put:
      tags:
      - Event Flows
      summary: Update a specific event flow
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: the event flow
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFlow'
        required: true
      responses:
        '200':
          description: The updated event flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFlow'
      x-codegen-request-body-name: eventFlow
      operationId: putEventFlowsById
      x-operation-id-source: derived
    delete:
      tags:
      - Event Flows
      summary: Delete a specific event flow
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteEventFlowsById
      x-operation-id-source: derived
components:
  schemas:
    EventFlowNodeMetadataTransform:
      type: object
      properties:
        condition:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/EventFlowNodeRule'
    EventFlowNode:
      type: object
      required:
      - nodeType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nodeType:
          type: string
          enum:
          - ROOT
          - SUPPORT_HOURS
          - ROUTE_EVENT
          - DEFINE_BRANCHES
          - WAIT
          - TRANSFORM
        metadata:
          $ref: '#/components/schemas/EventFlowNodeMetadata'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/EventFlowBranch'
    EventFlowNodeMetadataSupportHours:
      type: object
      required:
      - supportHoursId
      properties:
        supportHoursId:
          type: integer
          format: int64
    EventFlowNodeMetadataRouteEvent:
      type: object
      required:
      - alertSourceId
      properties:
        alertSourceId:
          type: integer
          format: int64
        overwritePriority:
          type: string
          enum:
          - HIGH
          - LOW
        escalationPolicyId:
          type: integer
          format: int64
    EventFlowNodeDefinition:
      type: object
      required:
      - branchName
      properties:
        branchName:
          type: string
        conditions:
          type: string
    EventFlowListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
    TeamRel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    EventFlow:
      type: object
      required:
      - name
      - root
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        root:
          $ref: '#/components/schemas/EventFlowNode'
    EventFlowBranch:
      type: object
      required:
      - branchType
      properties:
        id:
          type: integer
          format: int64
        branchType:
          type: string
          enum:
          - BRANCH
          - CATCH_ALL
          - ACCEPTED
        condition:
          type: string
        target:
          $ref: '#/components/schemas/EventFlowNode'
    EventFlowNodeMetadataDefineBranches:
      type: object
      properties:
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/EventFlowNodeDefinition'
    EventFlowNodeRule:
      type: object
      required:
      - name
      - target
      - operator
      properties:
        name:
          type: string
        target:
          type: string
        operator:
          type: string
          enum:
          - SET
          - COPY
          - MAP
          - TEMPLATE
          - MERGE
          - APPEND_ARRAY
        value:
          $ref: '#/components/schemas/DynamicValue'
        source:
          type: string
        mapping:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
        default:
          $ref: '#/components/schemas/DynamicValue'
        properties:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
        items:
          type: array
          items:
            type: object
            additionalProperties:
              type:
              - string
              - 'null'
    EventFlowNodeMetadata:
      oneOf:
      - $ref: '#/components/schemas/EventFlowNodeMetadataSupportHours'
      - $ref: '#/components/schemas/EventFlowNodeMetadataRouteEvent'
      - $ref: '#/components/schemas/EventFlowNodeMetadataDefineBranches'
      - $ref: '#/components/schemas/EventFlowNodeMetadataWait'
      - $ref: '#/components/schemas/EventFlowNodeMetadataTransform'
    DynamicValue:
      oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: object
        additionalProperties: true
      - type: array
        items: {}
    EventFlowNodeMetadataWait:
      type: object
      properties:
        waitForDuration:
          type: string
        waitStartSupportHoursId:
          type: integer
          format: int64
        waitEndSupportHoursId:
          type: integer
          format: int64
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
