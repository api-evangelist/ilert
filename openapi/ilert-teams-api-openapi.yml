openapi: 3.2.0
info:
  title: ilert REST Teams API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Teams
paths:
  /teams:
    get:
      tags:
      - Teams
      summary: Get teams
      parameters:
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: the maximum number of results when paging through a list of entities.
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      - name: members
        in: query
        description: optional, filter teams for specific members (currently only a single occurrence of this param is allowed)
        schema:
          type: number
      responses:
        '200':
          description: The teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
      operationId: getTeams
      x-operation-id-source: derived
    post:
      tags:
      - Teams
      summary: Create a new team
      requestBody:
        description: the team
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
      responses:
        '200':
          description: The newly created team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
      x-codegen-request-body-name: team
      operationId: postTeams
      x-operation-id-source: derived
  /teams/{id}:
    get:
      tags:
      - Teams
      summary: Get a specific team
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The requested team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
      operationId: getTeamsById
      x-operation-id-source: derived
    put:
      tags:
      - Teams
      summary: Update the specific team
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: the team
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
      responses:
        '200':
          description: The updated team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
      x-codegen-request-body-name: team
      operationId: putTeamsById
      x-operation-id-source: derived
    delete:
      tags:
      - Teams
      summary: Remove a specific team
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteTeamsById
      x-operation-id-source: derived
  /teams/{id}/members:
    post:
      tags:
      - Teams
      summary: Add a new team member to specific team
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: the team member
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMember'
        required: true
      responses:
        '200':
          description: The added team member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
      x-codegen-request-body-name: team member
      operationId: postTeamsByIdMembers
      x-operation-id-source: derived
  /teams/{id}/members/{id}:
    delete:
      tags:
      - Teams
      summary: Remove a specific member of a specific team
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteTeamsByIdMembersById
      x-operation-id-source: derived
components:
  schemas:
    User:
      required:
      - email
      - firstName
      - lastName
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        timezone:
          $ref: '#/components/schemas/TimeZone'
        position:
          type: string
        department:
          type: string
        avatarUrl:
          type: string
          readOnly: true
        language:
          type: string
          enum:
          - de
          - en
        region:
          type: string
          enum:
          - DE
          - GB
          - CH
          - CN
          - IN
          - US
          - FR
          - ES
          - CA
          - IE
        role:
          $ref: '#/components/schemas/Role'
        shiftColor:
          type: string
          description: Optional hex-color code for the user's shifts in schedules calendars
        mutedUntil:
          type: string
          description: Date in ISO-8601
          format: date-time
        createdAt:
          type: string
          description: Date in ISO-8601
          format: date-time
        updatedAt:
          type: string
          description: Date in ISO-8601
          format: date-time
    TeamVisibilityType:
      type: string
      enum:
      - PUBLIC
      - PRIVATE
    TimeZone:
      type: string
      enum:
      - Europe/Berlin
      - America/New_York
      - America/Los_Angeles
      - Asia/Istanbul
    TeamMember:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/TeamRole'
    Team:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/TeamVisibilityType'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        createdAt:
          type: string
          description: Date in ISO-8601
          format: date-time
        updatedAt:
          type: string
          description: Date in ISO-8601
          format: date-time
    Role:
      type: string
      enum:
      - STAKEHOLDER
      - GUEST
      - RESPONDER
      - USER
      - ADMIN
    TeamRole:
      type: string
      enum:
      - STAKEHOLDER
      - RESPONDER
      - USER
      - ADMIN
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
