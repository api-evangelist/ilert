openapi: 3.2.0
info:
  title: ilert REST Metric Data Sources API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Metric Data Sources
paths:
  /metric-data-sources:
    get:
      tags:
      - Metric Data Sources
      summary: Get Metric Data Sources
      parameters:
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: the maximum number of results when paging through a list of metric data sources
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: The Metric Data Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricDataSource'
      operationId: getMetricDataSources
      x-operation-id-source: derived
    post:
      tags:
      - Metric Data Sources
      summary: Create a new Metric Data Source
      requestBody:
        description: The metric data source
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDataSourcePost'
        required: true
      responses:
        '200':
          description: The newly created Metric Data Source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDataSource'
      x-codegen-request-body-name: metric data source
      operationId: postMetricDataSources
      x-operation-id-source: derived
  /metric-data-sources/{id}:
    get:
      tags:
      - Metric Data Sources
      summary: Get a specific Metric Data Source
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The requested Metric Data Source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDataSource'
      operationId: getMetricDataSourcesById
      x-operation-id-source: derived
    put:
      tags:
      - Metric Data Sources
      summary: Update the specific Metric Data Source
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: The metric data source
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDataSourcePost'
        required: true
      responses:
        '200':
          description: The updated Metric Data Source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDataSource'
      x-codegen-request-body-name: metric data source
      operationId: putMetricDataSourcesById
      x-operation-id-source: derived
    delete:
      tags:
      - Metric Data Sources
      summary: Delete a specific Metric Data Source
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteMetricDataSourcesById
      x-operation-id-source: derived
components:
  schemas:
    MetricDataSource:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        type:
          $ref: '#/components/schemas/MetricDataSourceType'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        metadata:
          $ref: '#/components/schemas/MetricDataSourceMetadata'
    MParamsDatadog:
      required:
      - apiKey
      - applicationKey
      - region
      type: object
      properties:
        region:
          type: string
        apiKey:
          type: string
        applicationKey:
          type: string
    MParamsPrometheus:
      required:
      - authType
      - url
      type: object
      properties:
        url:
          type: string
        authType:
          type: string
          enum:
          - NONE
          - BASIC
          - HEADER
        basicUser:
          type: string
          description: Optional, required for 'BASIC'
        basicPass:
          type: string
          description: Optional, required for 'BASIC'
        headerKey:
          type: string
          description: Optional, required for 'HEADER'
        headerValue:
          type: string
          description: Optional, required for 'HEADER'
    MetricDataSourceMetadata:
      type: object
      oneOf:
      - $ref: '#/components/schemas/MParamsDatadog'
      - $ref: '#/components/schemas/MParamsPrometheus'
    TeamRel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    MetricDataSourcePost:
      required:
      - metadata
      - name
      - type
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/MetricDataSourceType'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        metadata:
          $ref: '#/components/schemas/MetricDataSourceMetadata'
    MetricDataSourceType:
      type: string
      enum:
      - DATADOG
      - PROMETHEUS
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
