components:
  schemas:
    NotificationPreferencesDutyPost:
      type: object
      properties:
        beforeMin:
          $ref: '#/components/schemas/NotificationPreferencesDutyBeforeMin'
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        method:
          $ref: '#/components/schemas/NotificationPreferenceDutyMethod'
        type:
          $ref: '#/components/schemas/NotificationPreferencesDutyTypes'
    NotificationPreferencesAlertDelayMin:
      type: integer
    NotificationPreferenceAlertType:
      type: string
      enum:
      - LOW_PRIORITY
      - HIGH_PRIORITY
    ContactStatus:
      type: string
      enum:
      - OK
      - LOCKED
      - BLACKLISTED
    NotificationPreferencesSubscription:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        method:
          $ref: '#/components/schemas/NotificationPreferenceSubscriptionMethod'
    NotificationPreferencesUpdate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        method:
          $ref: '#/components/schemas/NotificationPreferenceUpdateMethod'
        type:
          $ref: '#/components/schemas/NotificationPreferencesUpdateType'
    ContactEmail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        target:
          type: string
        status:
          $ref: '#/components/schemas/ContactStatus'
    NotificationPreferencesDuty:
      type: object
      properties:
        id:
          type: integer
          format: int64
        beforeMin:
          $ref: '#/components/schemas/NotificationPreferencesDutyBeforeMin'
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        method:
          $ref: '#/components/schemas/NotificationPreferenceDutyMethod'
        type:
          $ref: '#/components/schemas/NotificationPreferencesDutyTypes'
    NotificationPreferencesAlertPost:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/NotificationPreferenceAlertMethod'
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        delayMin:
          $ref: '#/components/schemas/NotificationPreferencesAlertDelayMin'
        type:
          $ref: '#/components/schemas/NotificationPreferenceAlertType'
    NotificationPreferencesAlert:
      type: object
      properties:
        id:
          type: integer
          format: int64
        method:
          $ref: '#/components/schemas/NotificationPreferenceAlertMethod'
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        delayMin:
          $ref: '#/components/schemas/NotificationPreferencesAlertDelayMin'
        type:
          $ref: '#/components/schemas/NotificationPreferenceAlertType'
    NotificationPreferenceDutyMethod:
      type: string
      enum:
      - EMAIL
      - SMS
      - PUSH
      - WHATSAPP
      - TELEGRAM
    NotificationPreferencesDutyTypes:
      type: string
      enum:
      - ON_CALL
    NotificationPreferenceSubscriptionMethod:
      type: string
      enum:
      - EMAIL
      - SMS
      - PUSH
    NotificationPreferencesSubscriptionPost:
      type: object
      properties:
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        method:
          $ref: '#/components/schemas/NotificationPreferenceSubscriptionMethod'
    NotificationPreferenceAlertMethod:
      type: string
      enum:
      - EMAIL
      - SMS
      - PUSH
      - VOICE
      - WHATSAPP
      - TELEGRAM
    NotificationPreferencesUpdateType:
      type: string
      enum:
      - ALERT_ACCEPTED
      - ALERT_RESOLVED
      - ALERT_ESCALATED
    NotificationPreferenceUpdateMethod:
      type: string
      enum:
      - EMAIL
      - SMS
      - PUSH
      - WHATSAPP
      - TELEGRAM
    NotificationPreferencesUpdatePost:
      type: object
      properties:
        contact:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ContactPhoneNumber'
          - $ref: '#/components/schemas/ContactEmail'
        method:
          $ref: '#/components/schemas/NotificationPreferenceUpdateMethod'
        type:
          $ref: '#/components/schemas/NotificationPreferencesUpdateType'
    NotificationPreferencesDutyBeforeMin:
      type: integer
      enum:
      - 0
      - 15
      - 30
      - 60
      - 180
      - 360
      - 720
      - 1440
    ContactPhoneNumber:
      type: object
      properties:
        id:
          type: integer
          format: int64
        regionCode:
          type: string
        target:
          type: string
        primary:
          type: boolean
          description: May only be enabled for a single phone number contact at a time
        status:
          $ref: '#/components/schemas/ContactStatus'
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
