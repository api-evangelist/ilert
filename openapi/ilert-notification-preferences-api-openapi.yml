        description: numeric user id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: the response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreferencesAlert'
      operationId: getUsersByUserIdNotificationPreferencesAlerts
      x-operation-id-source: derived
