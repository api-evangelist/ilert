openapi: 3.2.0
info:
  title: ilert REST Call Flows API
  description: '# Introduction

    The ilert API is a RESTful API and provides programmatic access to entities in ilert and lets you easily integrate ilert with 3rd party tools.'
  version: v2.2026.5-r.3
  x-logo:
    url: ./ilert-logo-spaced.png
    backgroundColor: '#fafafa'
    altText: ilert documentation logo
servers:
- url: /api
security:
- apiKey: []
tags:
- name: Call Flows
paths:
  /call-flows:
    get:
      tags:
      - Call Flows
      summary: List existing call flows
      description: Returns a shallow list of call flows without the full node tree. Use the single resource endpoint to retrieve the complete call flow including all nodes and branches.
      parameters:
      - name: start-index
        in: query
        description: an integer specifying the starting point (beginning with 0) when paging through a list of entities
        schema:
          type: integer
          format: int32
          default: 0
      - name: max-results
        in: query
        description: the maximum number of results when paging through a list of entities.
        schema:
          maximum: 100
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: The call flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallFlowListItem'
      operationId: getCallFlows
      x-operation-id-source: derived
    post:
      tags:
      - Call Flows
      summary: Create a new call flow
      requestBody:
        description: the call flow
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallFlow'
        required: true
      responses:
        '201':
          description: The newly created call flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallFlow'
      x-codegen-request-body-name: callFlow
      operationId: postCallFlows
      x-operation-id-source: derived
  /call-flows/{id}:
    get:
      tags:
      - Call Flows
      summary: Get a specific call flow
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '200':
          description: The requested call flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallFlow'
      operationId: getCallFlowsById
      x-operation-id-source: derived
    put:
      tags:
      - Call Flows
      summary: Update a specific call flow
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      requestBody:
        description: the call flow
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallFlow'
        required: true
      responses:
        '200':
          description: The updated call flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallFlow'
      x-codegen-request-body-name: callFlow
      operationId: putCallFlowsById
      x-operation-id-source: derived
    delete:
      tags:
      - Call Flows
      summary: Delete a specific call flow
      parameters:
      - name: id
        in: path
        description: entity ID
        required: true
        schema:
          type: number
      responses:
        '204':
          description: Empty body delete response
          content: {}
      operationId: deleteCallFlowsById
      x-operation-id-source: derived
components:
  schemas:
    CallFlowNodeMetadataBlockNumbers:
      type: object
      required:
      - blacklist
      properties:
        blacklist:
          type: array
          items:
            type: string
    CallFlowNodeMetadataCreateAlert:
      type: object
      required:
      - alertSourceId
      properties:
        alertSourceId:
          type: integer
          format: int64
        acceptAlertOnAnswer:
          type: boolean
    CallFlowNodeMetadataCode:
      type: object
      required:
      - label
      properties:
        code:
          type: integer
          format: int64
        label:
          type: string
    CallFlowNodeMetadataIvrMenu:
      type: object
      required:
      - enabledOptions
      properties:
        textMessage:
          type: string
        customAudioUrl:
          type: string
        enabledOptions:
          type: array
          items:
            type: string
        aiVoiceModel:
          type: string
          enum:
          - emma
          - liam
          - isabelle
          - gordon
          - ivy
          - ellen
        language:
          type: string
          enum:
          - en
          - de
          - fr
          - es
          - nl
          - ru
          - it
        retries:
          type: integer
          format: int64
    PhoneNumber:
      type: object
      properties:
        regionCode:
          type: string
        number:
          type: string
    CallFlowNodeMetadataCallTarget:
      type: object
      required:
      - target
      - type
      properties:
        target:
          type: string
        type:
          type: string
          enum:
          - USER
          - ON_CALL_SCHEDULE
          - NUMBER
    CallFlowNodeMetadataIntent:
      type: object
      properties:
        type:
          type: string
          enum:
          - INCIDENT
          - SYSTEM_OUTAGE
          - SECURITY_BREACH
          - TECHNICAL_SUPPORT
          - INQUIRY
        label:
          type: string
        description:
          type: string
        examples:
          type: array
          items:
            type: string
    CallFlow:
      type: object
      required:
      - name
      - language
      - root
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        language:
          type: string
          enum:
          - de
          - en
        assignedNumber:
          $ref: '#/components/schemas/CallFlowNumber'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
        root:
          $ref: '#/components/schemas/CallFlowNode'
    CallFlowNodeMetadataSupportHours:
      type: object
      required:
      - supportHoursId
      properties:
        supportHoursId:
          type: integer
          format: int64
    CallFlowNodeMetadataPinCode:
      type: object
      required:
      - codes
      properties:
        textMessage:
          type: string
        customAudioUrl:
          type: string
        codes:
          type: array
          items:
            $ref: '#/components/schemas/CallFlowNodeMetadataCode'
        language:
          type: string
          enum:
          - en
          - de
          - fr
          - es
          - nl
          - ru
          - it
        retries:
          type: integer
          format: int64
        aiVoiceModel:
          type: string
          enum:
          - emma
          - liam
          - isabelle
          - gordon
          - ivy
          - ellen
    CallFlowNodeMetadataGather:
      type: object
      properties:
        type:
          type: string
          enum:
          - CALLER_NAME
          - CONTACT_NUMBER
          - EMAIL
          - INCIDENT
          - AFFECTED_SERVICES
        label:
          type: string
        varType:
          type: string
          enum:
          - NUMBER
          - DATE
          - BOOLEAN
          - STRING
        required:
          type: boolean
        question:
          type: string
    CallFlowNodeMetadataAudioMessage:
      type: object
      properties:
        textMessage:
          type: string
        customAudioUrl:
          type: string
        language:
          type: string
          enum:
          - en
          - de
          - fr
          - es
          - nl
          - ru
          - it
        aiVoiceModel:
          type: string
          enum:
          - emma
          - liam
          - isabelle
          - gordon
          - ivy
          - ellen
    CallFlowNodeMetadataEnrichment:
      type: object
      properties:
        enabled:
          type: boolean
        informationTypes:
          type: array
          items:
            type: string
            enum:
            - INCIDENT
            - MAINTENANCE
            - SERVICE_STATUS
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CallFlowNodeMetadataEnrichmentSource'
    CallFlowNumber:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
    CallFlowNodeMetadataEnrichmentSource:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - STATUS_PAGE
          - SERVICE
    CallFlowListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        assignedNumber:
          $ref: '#/components/schemas/CallFlowNumber'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamRel'
    CallFlowNodeMetadata:
      oneOf:
      - $ref: '#/components/schemas/CallFlowNodeMetadataAudioMessage'
      - $ref: '#/components/schemas/CallFlowNodeMetadataIvrMenu'
      - $ref: '#/components/schemas/CallFlowNodeMetadataVoicemail'
      - $ref: '#/components/schemas/CallFlowNodeMetadataPinCode'
      - $ref: '#/components/schemas/CallFlowNodeMetadataSupportHours'
      - $ref: '#/components/schemas/CallFlowNodeMetadataRouteCall'
      - $ref: '#/components/schemas/CallFlowNodeMetadataCreateAlert'
      - $ref: '#/components/schemas/CallFlowNodeMetadataBlockNumbers'
      - $ref: '#/components/schemas/CallFlowNodeMetadataAgentic'
    CallFlowNodeMetadataAgentic:
      type: object
      required:
      - textMessage
      - intents
      properties:
        textMessage:
          type: string
        customAudioUrl:
          type: string
        language:
          type: string
          enum:
          - en
          - de
          - fr
          - es
          - nl
          - ru
          - it
        aiVoiceModel:
          type: string
          enum:
          - emma
          - liam
          - isabelle
          - gordon
          - ivy
          - ellen
        intents:
          type: array
          items:
            $ref: '#/components/schemas/CallFlowNodeMetadataIntent'
        gathers:
          type: array
          items:
            $ref: '#/components/schemas/CallFlowNodeMetadataGather'
        enrichment:
          $ref: '#/components/schemas/CallFlowNodeMetadataEnrichment'
    CallFlowNode:
      type: object
      required:
      - nodeType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nodeType:
          type: string
          enum:
          - ROOT
          - IVR_MENU
          - AUDIO_MESSAGE
          - SUPPORT_HOURS
          - ROUTE_CALL
          - PARALLEL_ROUTE_CALL
          - VOICEMAIL
          - PIN_CODE
          - CREATE_ALERT
          - BLOCK_NUMBERS
          - AGENTIC
        metadata:
          $ref: '#/components/schemas/CallFlowNodeMetadata'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/CallFlowBranch'
    CallFlowNodeMetadataRouteCall:
      type: object
      required:
      - targets
      properties:
        holdAudioUrl:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/CallFlowNodeMetadataCallTarget'
        callStyle:
          type: string
          enum:
          - ORDERED
          - RANDOM
          - PARALLEL
        retries:
          type: integer
          format: int64
        callTimeoutSec:
          type: integer
          format: int64
    CallFlowNodeMetadataVoicemail:
      type: object
      properties:
        textMessage:
          type: string
        customAudioUrl:
          type: string
        language:
          type: string
          enum:
          - en
          - de
          - fr
          - es
          - nl
          - ru
          - it
        aiVoiceModel:
          type: string
          enum:
          - emma
          - liam
          - isabelle
          - gordon
          - ivy
          - ellen
        disableTranscription:
          type: boolean
    TeamRel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CallFlowBranch:
      type: object
      required:
      - branchType
      properties:
        id:
          type: integer
          format: int64
        branchType:
          type: string
          enum:
          - BRANCH
          - CATCH_ALL
          - ANSWERED
        condition:
          type: string
        target:
          $ref: '#/components/schemas/CallFlowNode'
  securitySchemes:
    apiKey:
      type: apiKey
      description: The Bearer API key of your user <a href='/api-docs/#section/Authentication'>more info</a>.
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
